spring.application.name=notification-service
server.port=${SERVER_PORT:8084}
server.tomcat.threads.max=20

# Datasource (được ghi đè bởi biến môi trường SPRING_DATASOURCE_* trong docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/quickbite_notification_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=3

# JPA / Hibernate: tự động tạo & cập nhật bảng theo entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
