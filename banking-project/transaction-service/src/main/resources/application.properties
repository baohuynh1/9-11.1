spring.application.name=transaction-service
server.port=8081

# Dùng chung core-db (banking_db); trong Docker được ghi đè bởi SPRING_DATASOURCE_*
spring.datasource.url=jdbc:postgresql://core-db:5432/banking_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Gọi account-service qua TÊN CONTAINER trong banking-network (không dùng localhost/IP)
account-service.base-url=${ACCOUNT_SERVICE_URL:http://account-service:8080}
