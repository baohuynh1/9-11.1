services:
  core-db:
    image: postgres:16-alpine
    container_name: core-db
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # KHÔNG map port 5432 ra host: chỉ các service trong banking-network truy cập được DB
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - banking-network

  account-service:
    build: .
    image: account-service:latest
    container_name: account-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/banking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC"
    ports:
      - "8080:8080"
    depends_on:
      core-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - banking-network

  transaction-service:
    build: ./transaction-service
    image: transaction-service:latest
    container_name: transaction-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/banking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Gọi account-service qua tên container trong banking-network
      ACCOUNT_SERVICE_URL: http://account-service:8080
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC"
    ports:
      - "8081:8081"
    depends_on:
      core-db:
        condition: service_healthy
      account-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - banking-network

networks:
  banking-network:
    name: banking-network
    driver: bridge

volumes:
  pg-data:
    name: pg-data
